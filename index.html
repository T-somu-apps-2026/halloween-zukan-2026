<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品図鑑</title>
<style>
  :root {
    --bg: #fdfaf4;
    --card-bg: #ffffff;
    --accent: #c97b5f;
    --accent-soft: #f3e3da;
    --text: #3a322c;
    --text-sub: #8a8178;
    --border: #ece4d8;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding-bottom: 40px;
  }

  header {
    text-align: center;
    padding: 28px 16px 18px;
  }

  header h1 {
    margin: 0 0 6px;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
  }

  header p {
    margin: 0;
    font-size: 0.85rem;
    color: var(--text-sub);
  }

  #count {
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-sub);
    margin-bottom: 14px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 0 12px;
    max-width: 640px;
    margin: 0 auto;
  }

  @media (min-width: 480px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease;
  }

  .card:active {
    transform: scale(0.96);
  }

  .thumb {
    aspect-ratio: 1 / 1;
    width: 100%;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb.empty {
    color: var(--accent);
    font-size: 1.6rem;
    font-weight: bold;
    opacity: 0.5;
  }

  .label {
    font-size: 0.68rem;
    text-align: center;
    padding: 6px 4px;
    color: var(--text-sub);
    line-height: 1.3;
    min-height: 2.2em;
  }

  .label.unnamed {
    opacity: 0.4;
  }

  /* モーダル */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 32, 24, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }

  .overlay.open {
    display: flex;
  }

  .modal {
    background: var(--card-bg);
    border-radius: 18px;
    max-width: 420px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    padding: 18px;
    position: relative;
  }

  .modal .close {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 1.3rem;
    color: var(--text-sub);
    background: none;
    border: none;
    cursor: pointer;
  }

  .modal-img {
    width: 100%;
    max-height: 60vh;
    border-radius: 12px;
    background: var(--accent-soft);
    overflow: hidden;
    margin-bottom: 14px;
  }

  .modal-img img {
    width: 100%;
    max-height: 60vh;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .modal h2 {
    margin: 0 0 4px;
    font-size: 1.1rem;
  }

  .modal .no {
    font-size: 0.75rem;
    color: var(--accent);
    margin: 0 0 10px;
  }

  .modal .story {
    font-size: 0.88rem;
    line-height: 1.8;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<header>
  <h1>作品図鑑</h1>
  <p>タップすると制作秘話が見られます</p>
</header>

<div id="count"></div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close" id="closeBtn">×</button>
    <div class="modal-img" id="modalImg"></div>
    <p class="no" id="modalNo"></p>
    <h2 id="modalName"></h2>
    <div class="story" id="modalStory"></div>
  </div>
</div>

<script src="items.js"></script>
<script>
  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const closeBtn = document.getElementById('closeBtn');
  const modalImg = document.getElementById('modalImg');
  const modalNo = document.getElementById('modalNo');
  const modalName = document.getElementById('modalName');
  const modalStory = document.getElementById('modalStory');

  // 名前が入っている（＝完成している）ものだけを表示する
  const registered = items
    .map((item, i) => ({ item, no: String(i + 1).padStart(2, '0') }))
    .filter(entry => entry.item.name && entry.item.name.trim() !== '');

  document.getElementById('count').textContent = `${registered.length} 件 公開中`;

  registered.forEach(({ item, no }) => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    if (item.file) {
      thumb.className = 'thumb';
      const img = document.createElement('img');
      img.src = 'images/' + item.file;
      img.alt = item.name;
      img.onerror = () => { thumb.classList.add('empty'); thumb.innerHTML = '?'; };
      thumb.appendChild(img);
    } else {
      thumb.className = 'thumb empty';
      thumb.textContent = '?';
    }
    card.appendChild(thumb);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = item.name;
    card.appendChild(label);

    card.addEventListener('click', () => openModal(item, no));
    grid.appendChild(card);
  });

  function openModal(item, no) {
    modalNo.textContent = 'No.' + no;
    modalName.textContent = item.name || '（未登録）';
    modalStory.textContent = item.story || '';
    modalImg.innerHTML = '';
    if (item.file) {
      const img = document.createElement('img');
      img.src = 'images/' + item.file;
      img.alt = item.name || '';
      modalImg.appendChild(img);
    } else {
      modalImg.style.display = 'flex';
      modalImg.style.alignItems = 'center';
      modalImg.style.justifyContent = 'center';
      modalImg.style.fontSize = '2rem';
      modalImg.style.color = 'var(--accent)';
      modalImg.textContent = '?';
    }
    overlay.classList.add('open');
  }

  closeBtn.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
</script>

</body>
</html>
